name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Mangue version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux (X11), Linux (Wayland)]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: 1. Open the attached file 2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: BPMN file, screenshots or logs
      description: Attach the `.bpmn` file that triggers the problem whenever possible.
