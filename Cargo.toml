[package]
name = "mangue"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui-component = { version = "=0.8.0", features = ["tree-sitter-html"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit"] }
image = { version = "0.25", default-features = false }
indexmap = "2.14.2"
quick-xml = "0.42.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_norway = "=0.9.42"

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["x11", "wayland"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
